services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whack_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=auto
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - whack_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whack_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - whack_network

networks:
  whack_network:
    driver: bridge
