services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whack_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whack_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
